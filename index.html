<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h1 {
            text-align: center;
        }
        #apps {
            max-width: 700px;
            margin: 30px auto;
        }
        ul {
            padding: 0;
            list-style: none;
        }
        li {
            margin: 12px 0;
        }
        a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            text-decoration: none;
            border: 1px solid #ccc;
            border-radius: 8px;
            color: inherit;
        }
        a:hover {
            text-decoration: underline;
        }
        .badge {
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            margin-left: 12px;
            flex-shrink: 0;
        }
        .badge-html {
            background: #e0f0ff;
            color: #0b5cab;
        }
        .badge-pdf {
            background: #ffe6e6;
            color: #b30000;
        }
    </style>
</head>
<body>
    <h1>My Applications</h1>
    <div id="apps">
        Loading applications...
    </div>
    <script>
        const owner = "kamalakar108";
        const repo = "10th_maths";
        const branch = "main";
        async function loadApplications() {
            const container = document.getElementById("apps");
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${owner}/${repo}/contents/?ref=${branch}`
                );
                if (!response.ok) {
                    throw new Error("Unable to access GitHub repository");
                }
                const files = await response.json();
                const applications = files
                    .filter(file =>
                        file.type === "file" &&
                        (file.name.toLowerCase().endsWith(".html") || file.name.toLowerCase().endsWith(".pdf")) &&
                        file.name.toLowerCase() !== "index.html"
                    )
                    .sort((a, b) =>
                        a.name.localeCompare(b.name)
                    );
                if (applications.length === 0) {
                    container.textContent =
                        "No applications found.";
                    return;
                }
                const list = document.createElement("ul");
                applications.forEach(app => {
                    const isPdf = app.name.toLowerCase().endsWith(".pdf");
                    const item = document.createElement("li");
                    const link = document.createElement("a");
                    link.href = app.name;

                    const nameSpan = document.createElement("span");
                    nameSpan.textContent = app.name.replace(/\.(html|pdf)$/i, "");
                    link.appendChild(nameSpan);

                    const badge = document.createElement("span");
                    badge.textContent = isPdf ? "PDF" : "HTML";
                    badge.className = "badge " + (isPdf ? "badge-pdf" : "badge-html");
                    link.appendChild(badge);

                    item.appendChild(link);
                    list.appendChild(item);
                });
                container.replaceChildren(list);
            } catch (error) {
                container.textContent =
                    "Unable to load the application list.";
                console.error(error);
            }
        }
        loadApplications();
    </script>
</body>
</html>
